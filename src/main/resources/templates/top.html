<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>TOP画面</title>
<link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
	<div th:replace="~{fragments/header :: header}"></div>
	<h1 class="section-title">TOP画面</h1>

	<h2 class="section-title">今月のセール品</h2>
	<p th:if="${#lists.isEmpty(saleViews)}">現在開催中のセールはありません。</p>

	<div class="sale-grid">
		<div class="sale-card" th:each="sale : ${saleViews}">
			<p class="sale-category" th:text="${sale.category.categoryName}">カテゴリー名</p>

			<a th:href="@{/products/{id}(id=${sale.product.productId})}">
				<img class="sale-image" th:src="@{${sale.product.imgPath}}" th:alt="${sale.product.productName}">
				<p class="sale-product-name" th:text="${sale.product.productName}">商品名</p>
			</a>

			<p class="sale-name" th:text="${sale.salesItem.saleName}">セール名</p>
			<p class="sale-price">
				<span class="price-original" th:text="${sale.product.price} + '円'">0円</span>
				<span class="price-discounted" th:text="${sale.discountedPrice} + '円'">0円</span>
				<span class="discount-badge" th:text="${sale.salesItem.discountRate} + '%OFF'">0%OFF</span>
			</p>
		</div>
	</div>
	<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
